# Build and publish the Windows installer to a GitHub release when a v* tag
# lands. electron-builder --publish always also uploads latest.yml, which is
# what installed apps' electron-updater polls — so this workflow IS the
# auto-update feed. The artifactName template in electron-builder.yml must
# never change (old blockmap URLs derive from it).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @contrail/engine test
      - name: Build and publish installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --win nsis --publish always
