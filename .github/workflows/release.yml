# Build and publish the Windows installer to a GitHub release when a v* tag
# lands. electron-builder --publish always also uploads latest.yml, which is
# what installed apps' electron-updater polls — so this workflow IS the
# auto-update feed. The artifactName template in electron-builder.yml must
# never change (old blockmap URLs derive from it).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @contrail/engine test
      - run: pnpm --filter @contrail/apex-ls test
      # Boot gate: a full headless main-process boot of the built bundle.
      # v0.21.1 shipped a bundle that died with a SyntaxError before its
      # first log line — tests never execute the bundled output, so only an
      # actual boot catches that class. A load-time crash pops Electron's
      # error dialog and hangs, hence the hard timeout = loud failure.
      - name: Smoke-boot the built app
        timeout-minutes: 5
        working-directory: apps/desktop
        env:
          CONTRAIL_DATA_DIR: ${{ runner.temp }}\contrail-smoke
        run: pnpm smoke
      - name: Build and publish installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --win nsis --publish always
      # electron-builder's GitHub uploads flake silently on the big exe (three
      # of the first four releases shipped missing assets while the step
      # exited 0). Verify every asset actually landed and re-upload the
      # stragglers with gh, whose uploader retries properly. latest.yml is the
      # auto-update feed — a release without it 404s every installed app.
      - name: Verify and repair release assets
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          have=$(gh release view "$TAG" --json assets -q '.assets[].name' || true)
          for f in release/*.exe release/*.exe.blockmap release/latest.yml; do
            [ -e "$f" ] || { echo "local artifact missing: $f"; exit 1; }
            name=$(basename "$f")
            if ! grep -qxF "$name" <<<"$have"; then
              echo "missing on the release: $name — uploading"
              gh release upload "$TAG" "$f" --clobber
            fi
          done
          echo "release assets now:"
          gh release view "$TAG" --json assets -q '.assets[].name'
